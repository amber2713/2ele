<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Digital USTC</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         开场动画系统
    ========================== -->

    <div id="intro-overlay">

        <!-- 背景图 -->
        <div id="background-layer"></div>

        <!-- 黑色遮罩 -->
        <div id="overlay-dark"></div>

        <!-- CRT扫描 -->
        <div id="glitch-layer"></div>

        <!-- 主文字 -->
        <div id="intro-text"></div>

        <!-- 副文字 -->
        <div id="intro-sub"></div>

        <!-- 系统提示 -->
        <div id="system-tip">
            CLICK ANYWHERE TO SKIP
        </div>

        <!-- ENTER -->
        <button
            id="enter-btn"
            onclick="skipIntro()"
        >
            ENTER
        </button>

    </div>

    <!-- =========================
         粒子背景
    ========================== -->

    <canvas id="bg"></canvas>

    <!-- =========================
         顶栏
    ========================== -->

    <div class="topbar">

        <div
            class="explore"

            onclick="
            location.href=
            'https://jovial-naiad-a3ecb6.netlify.app'
            "
        >
            Explore
        </div>

    </div>

    <!-- =========================
         标题
    ========================== -->

    <div class="title-center">

        Digital USTC

    </div>

    <!-- =========================
         主界面
    ========================== -->

    <div class="container">

        <!-- 左侧 -->

        <div class="left">

            <input
                id="k1"
                placeholder="Keyword 1"
            >

            <input
                id="k2"
                placeholder="Keyword 2"
            >

            <input
                id="k3"
                placeholder="Keyword 3"
            >

            <button onclick="generate()">

                Generate

            </button>

            <div
                id="poemDisplay"
                class="poem-container"
            ></div>

        </div>

        <!-- 右侧 -->

        <div class="right">

            <div
                id="loader"
                class="loader hidden"
            ></div>

            <img id="img">

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

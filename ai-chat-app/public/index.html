<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1958 Café - A Timeless Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Playfair Display', serif;
        }

        body {
            overflow: hidden;
            height: 100vh;
            background: #0f0f0f;
            color: #3E2723;
        }

        /* ================= 新增：全屏欢迎封面层 ================= */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('./images/background.jpg') center center / cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* 封面淡出隐藏样式 */
        .welcome-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        /* 探索图标按钮 */
        .explore-btn {
            font-size: 32px;
            color: #FFF8EF;
            background: rgba(93, 64, 55, 0.8);
            backdrop-filter: blur(5px);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .explore-btn i {
            margin-bottom: 4px;
        }

        .explore-btn span {
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .explore-btn:hover {
            transform: scale(1.15);
            background: rgba(141, 110, 99, 0.9);
            box-shadow: 0 0 25px rgba(255,255,255,0.5);
            border-color: #FFF8EF;
        }

        /* ================= 地图图标 (右上角) ================= */
        .map-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 28px;
            color: #FFF8EF;
            background: rgba(0, 0, 0, 0.4);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 110;
        }

        .map-btn:hover {
            transform: scale(1.2);
            background: rgba(141, 110, 99, 0.8);
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* ================= 对话界面层 ================= */
        .inside-space {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f8ecd8 0%, #d9c7a7 100%);
            z-index: 200;
            flex-direction: column;
            padding: 40px;
            opacity: 1;
        }

        .inside-header { text-align: center; margin-bottom: 30px; }
        .inside-title { font-size: 3rem; color: #5D4037; position: relative; animation: titleGlow 3s infinite alternate; }

        .inside-content { display: flex; height: calc(100% - 150px); gap: 40px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .girl-container { flex: 1; display: flex; justify-content: center; align-items: center; }
        
        /* 修改：把人物图片的最大宽度从 400px 限制为 200px (原大小的一半) */
        .girl { width: 100%; max-width: 400px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); animation: float 4s infinite ease-in-out; }
        
        .chat-container { flex: 1; display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .message { max-width: 85%; padding: 14px 20px; border-radius: 20px; font-size: 1.05rem; line-height: 1.5; }
        .message.bot { align-self: flex-start; background: #E7D8C9; color: #4E342E; border-bottom-left-radius: 5px; }
        .message.user { align-self: flex-end; background: #8D6E63; color: white; border-bottom-right-radius: 5px; }

        .chat-input { display: flex; gap: 12px; }
        .chat-input input { flex: 1; padding: 15px 25px; border-radius: 30px; border: 1px solid #D7CCC8; background: #FFF; font-size: 1rem; }
        .chat-input button { background: #8D6E63; color: white; border: none; width: 55px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
        .chat-input button:hover { transform: scale(1.1); background: #5D4037; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes titleGlow { from { text-shadow: 0 0 5px rgba(93,64,55,0.2); } to { text-shadow: 0 0 20px rgba(93,64,55,0.4); } }

        /* 移动端适配 */
        @media (max-width: 900px) {
            .inside-content { flex-direction: column; overflow-y: auto; }
            /* 移动端下保持比例缩小 */
            .girl { max-width: 120px; }
            .chat-container { height: 500px; }
        }
    </style>
</head>

<body>

    <div class="welcome-overlay" id="welcomeOverlay">
        <div class="explore-btn" onclick="enterSite()" title="Explore">
            <i class="fas fa-compass fa-spin-slow"></i>
            <span>Explore</span>
        </div>
    </div>

    <div class="inside-space" id="insideSpace">
        <a href="https://sakura1234.netlify.app/" class="map-btn" title="Open Map">
            <i class="fas fa-map-marked-alt"></i>
        </a>

        <div class="inside-header">
            <h2 class="inside-title">Call Me USTC</h2>
        </div>

        <div class="inside-content">
            <div class="girl-container">
                <img src="./images/coffee_guo.png" alt="Friendly Barista" class="girl">
            </div>

            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="message bot">
                        你想喝茶还是咖啡？
                    </div>
                </div>

                <div class="chat-input">
                    <input type="text" id="userInput" placeholder="Speak to her..." autocomplete="off">
                    <button onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

<script>
/* ================= 进入网站逻辑 ================= */
function enterSite() {
    const overlay = document.getElementById('welcomeOverlay');
    overlay.classList.add('hidden');
}

/* ================= 聊天机器人逻辑 ================= */
const chatHistory = [
    { role: 'assistant', content: '你想喝茶还是咖啡？' }
];

function addMessage(text, sender) {
    const chatMessages = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'message ' + sender;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
}

function botTypeWriter(element, text) {
    element.textContent = '';
    let i = 0;
    function typing() {
        if (i < text.length) {
            element.textContent += text.charAt(i++);
            setTimeout(typing, 40);
        }
    }
    typing();
}

async function sendMessage() {
    const input = document.getElementById('userInput');
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, 'user');
    chatHistory.push({ role: 'user', content: message });
    input.value = '';

    const botDiv = addMessage('……', 'bot');

    try {
        const res = await fetch('/.netlify/functions/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: chatHistory })
        });
        
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        chatHistory.push({ role: 'assistant', content: data.content });
        botTypeWriter(botDiv, data.content);

    } catch (err) {
        botDiv.textContent = 'She gazes out the window, lost in thought.';
    }
}

document.getElementById('userInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
